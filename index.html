<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#ffe6f2"><title>タッチあそび</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#fff6e9;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>const cv=document.getElementById('c'),X=cv.getContext('2d');
let W=800,H=600,S=6,DPR=1,LW=3,T=0,cur=null;
const OL='#5b3a29';
const PAL=['#ff9fb8','#8fdcc0','#ffe27a','#8cc8f0','#c9a8ff','#ffb98a','#ff8c8c','#9be38f'];
const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const TAU=Math.PI*2;
// ---------- drawing helpers ----------
function P(){X.beginPath();}
function fs(f,st=1){X.fillStyle=f;X.fill();if(st){X.lineWidth=LW*st;X.strokeStyle=OL;X.lineJoin='round';X.stroke();}}
function circ(x,y,r,f,st=1){P();X.arc(x,y,Math.max(.1,r),0,TAU);fs(f,st);}
function ell(x,y,rx,ry,f,st=1,rot=0){P();X.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);fs(f,st);}
function rrp(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function rr(x,y,w,h,r,f,st=1){P();rrp(x,y,w,h,r);fs(f,st);}
function poly(p,f,st=1){P();X.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)X.lineTo(p[i],p[i+1]);X.closePath();fs(f,st);}
function line(a,b,c,d,w=1,col=OL){P();X.moveTo(a,b);X.lineTo(c,d);X.lineWidth=LW*w;X.strokeStyle=col;X.lineCap='round';X.stroke();}
function blob(cs,f,st=1){if(st)for(const c of cs){P();X.arc(c[0],c[1],c[2],0,TAU);X.lineWidth=LW*2*st;X.strokeStyle=OL;X.stroke();}for(const c of cs){P();X.arc(c[0],c[1],c[2],0,TAU);X.fillStyle=f;X.fill();}}
function heart(x,y,s,f,st=0){P();X.moveTo(x,y+s);X.bezierCurveTo(x-s*1.3,y,x-s*.7,y-s*1.1,x,y-s*.4);X.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.3,y,x,y+s);fs(f,st);}
function star(x,y,r,f,st=1,n=5,ir=.5,rot=0){P();for(let i=0;i<n*2;i++){const a=rot-Math.PI/2+i*Math.PI/n,q=i%2?r*ir:r;X.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}X.closePath();fs(f,st);}
function face(x,y,r,m=0,seed=0){
  const blink=((T+seed*1.7)%4)<.13,ex=r*.38,ey=-r*.1,er=r*.11,lw=Math.max(1.5,r*.07);
  X.lineCap='round';
  if(m==1||m==3||blink){for(const s of[-1,1]){P();X.arc(x+s*ex,y+ey+er*.4,er,Math.PI*1.15,Math.PI*1.85);X.lineWidth=lw;X.strokeStyle=OL;X.stroke();}}
  else for(const s of[-1,1]){circ(x+s*ex,y+ey,er,OL,0);circ(x+s*ex+er*.35,y+ey-er*.35,er*.38,'#fff',0);}
  X.globalAlpha=.55;circ(x-r*.6,y+r*.18,r*.15,'#ff7f98',0);circ(x+r*.6,y+r*.18,r*.15,'#ff7f98',0);X.globalAlpha=1;
  if(m==2)ell(x,y+r*.3,r*.11,r*.14,'#c0485a',0);
  else if(m==3){P();X.arc(x,y+r*.12,r*.28,0,Math.PI);X.closePath();fs('#d65a6e',0);}
  else{P();X.arc(x,y+r*.08,r*.24,.2*Math.PI,.8*Math.PI);X.lineWidth=lw;X.strokeStyle=OL;X.stroke();}
}
function sky(c1='#bfe6ff',c2='#fff3fb'){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);X.fillStyle=g;X.fillRect(0,0,W,H);}
function ground(y,c='#a8e6a1'){P();X.moveTo(0,y);for(let x=0;x<=W+20;x+=20)X.lineTo(x,y+Math.sin(x*.02)*S*1.2);X.lineTo(W,H);X.lineTo(0,H);X.closePath();X.fillStyle=c;X.fill();}
function cloud(x,y,s,f='#fff'){blob([[x-s,y,s*.65],[x,y-s*.35,s*.85],[x+s,y,s*.65],[x,y+s*.15,s*.7]],f);}
function sun(x,y,r){X.save();X.translate(x,y);X.rotate(T*.3);for(let i=0;i<10;i++){X.rotate(TAU/10);rr(-r*.13,-r*1.55,r*.26,r*.42,r*.13,'#ffd166');}X.restore();circ(x,y,r,'#ffe27a');face(x,y,r,0,3);}
function clouds(){cloud(W*.2+Math.sin(T*.2)*S*3,H*.12,S*6);cloud(W*.6+Math.sin(T*.15+2)*S*4,H*.08,S*4.5);}
// ---------- particles ----------
let parts=[];
function addP(x,y,o={}){if(parts.length>450)parts.shift();parts.push(Object.assign({x,y,vx:0,vy:0,g:0,life:1,max:1,size:S*1.6,c:pick(PAL),k:'c',rot:R(0,6),vr:R(-4,4),drag:1},o));}
function burst(x,y,n,o={}){const sp=o.sp||S*60;for(let i=0;i<n;i++){const a=R(0,TAU),v=R(.3,1)*sp;addP(x,y,Object.assign({vx:Math.cos(a)*v,vy:Math.sin(a)*v},o,{c:o.c||pick(PAL)}));}}
function upP(dt){for(const p of parts){const d=Math.pow(p.drag,dt*60);p.vx*=d;p.vy*=d;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt/p.max;p.rot+=p.vr*dt;}parts=parts.filter(p=>p.life>0);}
function drP(){for(const p of parts){X.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));const s=p.size*(p.grow?1+(1-p.life)*p.grow:1);
  if(p.k=='h')heart(p.x,p.y,s,p.c);else if(p.k=='s')star(p.x,p.y,s,p.c,0,5,.45,p.rot);
  else if(p.k=='r'){X.save();X.translate(p.x,p.y);X.rotate(p.rot);X.fillStyle=p.c;X.fillRect(-s,-s*.5,s*2,s);X.restore();}
  else if(p.k=='ring'){P();X.arc(p.x,p.y,s,0,TAU);X.lineWidth=LW;X.strokeStyle=p.c;X.stroke();}
  else if(p.k=='b'){P();X.arc(p.x,p.y,s,0,TAU);X.fillStyle='rgba(255,255,255,.75)';X.fill();X.lineWidth=1.5;X.strokeStyle='#9fd3f0';X.stroke();}
  else circ(p.x,p.y,s,p.c,0);}X.globalAlpha=1;}
const confetti=(x,y,n=40)=>burst(x,y,n,{k:'r',g:S*60,size:S*1.2,max:2,sp:S*90,drag:.98});
const sparkle=(x,y,n=8)=>burst(x,y,n,{k:'s',size:S*1.6,max:.8,sp:S*40,c:pick(['#ffe27a','#fff','#ffd1e8'])});
const hearts=(x,y,n=6)=>burst(x,y,n,{k:'h',size:S*2,max:1.4,sp:S*30,g:-S*30,c:pick(['#ff7f98','#ff9fb8','#ffb3c6'])});
// ---------- audio ----------
let AC=null,MG=null,NB=null;
function au(){try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.7;MG.connect(AC.destination);}if(AC.state!='running')AC.resume();}catch(e){}return AC;}
function tone(f,d=.2,type='sine',v=.2,f2=0,dl=0){const a=au();if(!a)return;const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.05);}
function noise(d=.2,v=.2,fq=1000,ft='lowpass',dl=0,q=1){const a=au();if(!a)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;}const t=a.currentTime+dl,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;f.type=ft;f.frequency.value=fq;f.Q.value=q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random());s.stop(t+d+.05);}
function osc(type,v,dur){const a=au();if(!a)return null;const t=a.currentTime,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=2200;o.type=type;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.06);g.gain.setValueAtTime(v,t+dur-.2);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f);f.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.05);return{o,t};}
const PENT=[523,587,659,784,880,1047,1175,1319,1568,1760];
function note(i,d=.6,type='triangle',v=.2){i=((i%10)+10)%10;tone(PENT[i],d,type,v);tone(PENT[i]*2,d*.5,'sine',v*.3);}
function pop(){tone(R(700,1000),.09,'sine',.3,200);noise(.05,.1,3000,'highpass');}
function boing(p=1){tone(160*p,.35,'triangle',.3,480*p);tone(240*p,.25,'sine',.12,620*p,.05);}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,i==3?.7:.17,'square',.07,0,i*.15));}
function rustle(){noise(.35,.15,2500,'bandpass',0,.7);}
function policeSiren(){const s=osc('sawtooth',.08,3.3);if(!s)return;const fr=s.o.frequency;let t=s.t;fr.setValueAtTime(650,t);for(let i=0;i<2;i++){fr.linearRampToValueAtTime(1400,t+1);fr.linearRampToValueAtTime(650,t+1.65);t+=1.65;}}
function ambSiren(){const s=osc('square',.05,3.3);if(!s)return;for(let i=0;i<7;i++)s.o.frequency.setValueAtTime(i%2?770:960,s.t+i*.48);}
function fireSiren(){const s=osc('sawtooth',.06,3.3);if(s){const fr=s.o.frequency;fr.setValueAtTime(450,s.t);fr.linearRampToValueAtTime(1150,s.t+1.6);fr.linearRampToValueAtTime(650,s.t+3.3);}for(let i=0;i<8;i++){tone(1800,.25,'triangle',.12,0,i*.4);tone(2700,.15,'sine',.05,0,i*.4);}}
let JV=null;function voices(){try{JV=speechSynthesis.getVoices().find(v=>/ja/i.test(v.lang))||null;}catch(e){}}
if(window.speechSynthesis){voices();speechSynthesis.onvoiceschanged=voices;}
function say(txt,pitch=1.8,rate=1.1,fb){if(JV){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='ja-JP';u.voice=JV;u.pitch=pitch;u.rate=rate;speechSynthesis.speak(u);return;}catch(e){}}fb&&fb();}
function giggle(n=5){for(let k=0;k<n;k++){const f=R(650,950);tone(f,.1,'triangle',.18,f*.72,k*.12);}}
const CRY={cat:['にゃーん',()=>{tone(500,.5,'sawtooth',.07,900);tone(900,.4,'sawtooth',.06,450,.3);}],
 dog:['わんわん',()=>{tone(420,.12,'square',.08,250);tone(440,.12,'square',.08,260,.22);}],
 cow:['もーー',()=>tone(150,.9,'sawtooth',.1,110)],
 duck:['がーがー',()=>{noise(.12,.2,900,'bandpass',0,5);noise(.12,.2,900,'bandpass',.2,5);}],
 pig:['ぶーぶー',()=>{tone(110,.15,'square',.08,90);tone(110,.15,'square',.08,90,.25);}],
 rabbit:['ぴょん',()=>boing(1.5)],bear:['がおー',()=>tone(220,.6,'sawtooth',.08,130)],
 chick:['ぴよぴよ',()=>{tone(2200,.1,'sine',.15,2700);tone(2200,.1,'sine',.15,2700,.18);}]};
function cry(k){const c=CRY[k];say(c[0],1.6,1.1,c[1]);}
// ---------- characters ----------
function animal(k,x,y,r,m=0){
  if(k=='cat'){for(const s of[-1,1])poly([x+s*r*.9,y-r*.25,x+s*r*.72,y-r*1.15,x+s*r*.15,y-r*.85],'#ffc98a');circ(x,y,r,'#ffc98a');face(x,y,r,m,x*.01);for(const s of[-1,1]){line(x+s*r*.45,y+r*.2,x+s*r*1.05,y+r*.1,.6);line(x+s*r*.45,y+r*.32,x+s*r*1.05,y+r*.38,.6);}return;}
  if(k=='dog'){circ(x,y,r,'#f3cf9b');face(x,y,r,m,x*.01);ell(x-r*.92,y-r*.05,r*.3,r*.6,'#a8714a',1,.3);ell(x+r*.92,y-r*.05,r*.3,r*.6,'#a8714a',1,-.3);ell(x,y+r*.02,r*.13,r*.09,OL,0);return;}
  if(k=='cow'){for(const s of[-1,1]){poly([x+s*r*.45,y-r*.8,x+s*r*.75,y-r*1.2,x+s*r*.7,y-r*.7],'#ffe9a8');ell(x+s*r*1,y-r*.35,r*.35,r*.18,'#fff',1,s*.4);}circ(x,y,r,'#fff');ell(x-r*.45,y-r*.5,r*.25,r*.2,'#4a4a4a',0);ell(x+r*.55,y-r*.1,r*.18,r*.25,'#4a4a4a',0);face(x,y-r*.1,r,m,x*.01);ell(x,y+r*.5,r*.5,r*.32,'#ffb3c6');circ(x-r*.18,y+r*.5,r*.06,OL,0);circ(x+r*.18,y+r*.5,r*.06,OL,0);return;}
  if(k=='duck'){circ(x,y,r,'#fff07a');ell(x,y-r*.9,r*.12,r*.22,'#fff07a');face(x,y-r*.1,r,m,x*.01);ell(x,y+r*.35,r*.38,r*.16,'#ff9f43');return;}
  if(k=='pig'){for(const s of[-1,1])poly([x+s*r*.85,y-r*.4,x+s*r*.7,y-r*1.05,x+s*r*.25,y-r*.8],'#ffb3c6');circ(x,y,r,'#ffc4d3');face(x,y-r*.12,r,m,x*.01);ell(x,y+r*.3,r*.32,r*.22,'#ff9fb8');ell(x-r*.11,y+r*.3,r*.06,r*.09,OL,0);ell(x+r*.11,y+r*.3,r*.06,r*.09,OL,0);return;}
  if(k=='rabbit'){for(const s of[-1,1]){ell(x+s*r*.38,y-r*1.15,r*.25,r*.65,'#fff',1,s*.15);ell(x+s*r*.38,y-r*1.15,r*.11,r*.45,'#ffb3c6',0,s*.15);}circ(x,y,r,'#fff');face(x,y,r,m,x*.01);return;}
  if(k=='bear'){for(const s of[-1,1]){circ(x+s*r*.72,y-r*.72,r*.32,'#c99366');circ(x+s*r*.72,y-r*.72,r*.16,'#f2c9a0',0);}circ(x,y,r,'#c99366');ell(x,y+r*.3,r*.38,r*.28,'#f2d6b8',0);face(x,y,r,m,x*.01);ell(x,y+r*.12,r*.12,r*.08,OL,0);return;}
  if(k=='chick'){circ(x,y,r,'#ffe45c');for(let i=-1;i<=1;i++)ell(x+i*r*.15,y-r*.95,r*.08,r*.2,'#ffe45c',1,i*.4);face(x,y,r,m,x*.01);poly([x-r*.15,y+r*.05,x+r*.15,y+r*.05,x,y+r*.25],'#ff9f43');return;}
}
const AN=['cat','dog','cow','duck','pig','rabbit'];
function apple(x,y,r){line(x,y-r*.8,x+r*.1,y-r*1.25,.9,'#8b5a2b');ell(x+r*.38,y-r*1.05,r*.35,r*.17,'#7fd36b',1,-.5);circ(x,y,r,'#ff6b6b');ell(x-r*.4,y-r*.35,r*.18,r*.12,'rgba(255,255,255,.7)',0,-.6);if(r>S*1.5)face(x,y+r*.12,r*.75,0,x);}
function vehicle(k,x,y,s,wr=0,lit=0){
  const L=k=='fire'?1.5:1.2,body=k=='fire'?'#ff6b6b':'#fff';
  if(k=='fire'){rr(x+s*.2,y-s*.95,s*1.1,s*.6,s*.2,body);rr(x+s*.35,y-s*.85,s*.5,s*.36,s*.1,'#bfe8ff',.6);}
  else{rr(x-s*.6,y-s*.95,s*1.2,s*.6,s*.22,body);rr(x-s*.45,y-s*.85,s*.42,s*.36,s*.1,'#bfe8ff',.6);rr(x+s*.05,y-s*.85,s*.42,s*.36,s*.1,'#bfe8ff',.6);}
  const blink=lit&&Math.sin(T*22)>0;
  if(k=='police')rr(x-s*.3,y-s*1.12,s*.6,s*.18,s*.08,blink?'#ff2d2d':'#ffb3b3');
  if(k=='ambulance')rr(x-s*.15,y-s*1.12,s*.3,s*.18,s*.08,blink?'#ff2d2d':'#ffb3b3');
  if(k=='fire')rr(x+s*.6,y-s*1.12,s*.3,s*.18,s*.08,blink?'#ffe600':'#fff3a0');
  P();rrp(x-s*L,y-s*.45,s*L*2,s*.68,s*.25);X.fillStyle=body;X.fill();
  X.save();P();rrp(x-s*L,y-s*.45,s*L*2,s*.68,s*.25);X.clip();
  if(k=='police'){X.fillStyle='#3a3a4a';X.fillRect(x-s*L,y-s*.02,s*L*2,s*.4);}
  if(k=='ambulance'){X.fillStyle='#ff5c5c';X.fillRect(x-s*L,y-s*.12,s*L*2,s*.1);}
  if(k=='fire'){X.fillStyle='#fff';X.fillRect(x-s*L,y-s*.05,s*L*2,s*.07);}
  X.restore();P();rrp(x-s*L,y-s*.45,s*L*2,s*.68,s*.25);X.lineWidth=LW;X.strokeStyle=OL;X.stroke();
  if(k=='police')star(x-s*.35,y-s*.22,s*.14,'#ffd166',.5);
  if(k=='ambulance'){rr(x-s*.5,y-s*.38,s*.1,s*.3,2,'#ff5c5c',0);rr(x-s*.6,y-s*.28,s*.3,s*.1,2,'#ff5c5c',0);}
  if(k=='fire'){rr(x-s*1.4,y-s*.68,s*1.5,s*.16,s*.05,'#e8e8e8',.7);for(let i=0;i<6;i++)line(x-s*1.3+i*s*.26,y-s*.68,x-s*1.3+i*s*.26,y-s*.52,.5);}
  face(x+s*L*.7,y-s*.18,s*.3,lit?1:0,2);
  for(const d of[-1,1]){const wx=x+d*s*L*.6,wy=y+s*.22;circ(wx,wy,s*.3,'#5a5a66');circ(wx,wy,s*.13,'#e0e0e0',.5);line(wx,wy,wx+Math.cos(wr)*s*.25,wy+Math.sin(wr)*s*.25,.6,'#e0e0e0');}
}
function town(gy){const cols=['#ffd1dc','#d6f0ff','#fff1b8','#e3d4ff','#d4f5e3'];for(let i=0;i<7;i++){const w=W/6,x=i*w-w*.3,h=H*(.18+((i*37)%5)*.04);rr(x,gy-h,w*.8,h+10,S*2,cols[i%5],.6);for(let r=0;r<2;r++)for(let c=0;c<2;c++)rr(x+w*.12+c*w*.32,gy-h+S*3+r*S*7,w*.2,S*4,S*1,'#fff8d6',.4);}}
function road(gy){X.fillStyle='#b8b8c8';X.fillRect(0,gy,W,H*.22);for(let x=(-T*0)%60;x<W;x+=S*14){X.fillStyle='#fff';X.fillRect(x,gy+H*.1,S*7,S*1);}X.fillStyle='#a8e6a1';X.fillRect(0,gy+H*.22,W,H);}
// ---------- games ----------
function carGame(kind,c,siren){return{c,icon(x,y,r){vehicle(kind,x,y+r*.2,r*.5,0,1);},
  init(){this.x=W/2;this.gy=H*.62;this.s=Math.min(W*.18,H*.2);this.on=0;this.wr=0;this.wrap=0;this.hop=0;this.hv=0;},
  update(dt){if(this.on){const sp=(W+this.s*3.2)/3.2;this.x+=sp*dt;this.wr+=sp*dt/(this.s*.3);if(this.x>W+this.s*1.6){this.x=-this.s*1.6;this.wrap=1;}if(this.wrap&&this.x>=W/2){this.x=W/2;this.on=0;}}
